# Pipeline parameters.
proof_marker: phase2_smoke_test

# Cohort selection (males-only primary, full-cohort sensitivity).
# Override via `KEDRO_ENV=full_cohort` — see conf/full_cohort/parameters.yml.
analysis_mode: males_only

# Optional outlier exclusions (path may not exist; node guards in-line).
sample_exclusions_path: outputs/reports/data_ingest/sample_exclusions.csv

# Per-track names (consumed by the namespaced enrich pipeline).
track_st: st
track_py: py

# attribute pipeline — paths to optional/h5ad inputs handled inside nodes
# (Kedro's catalog can't natively express anndata or "may-not-exist" files).
sea_ad_paths:
  full:  data/external/sea_ad/effect_sizes.h5ad
  early: data/external/sea_ad/effect_sizes_early.h5ad
  late:  data/external/sea_ad/effect_sizes_late.h5ad
wmb_expression_path: outputs/reports/wmb_expression/wmb_kinase_expression.csv
song_specificity_path: outputs/reports/snrna_integration/song_expression_specificity.csv
song_concordance_path: outputs/reports/snrna_integration/song_concordance.csv
