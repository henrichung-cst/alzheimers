# Datasets are declared as Phase 4 migrates each stage to Kedro nodes.
# Catalog grows incrementally; adding entries pre-emptively rots.

# ingest_mapping pipeline
song_tmt_layout:
  type: pandas.ExcelDataset
  filepath: "data/datasets/song/primary/metadata/Sample_list_72mice (1).xlsx"
  load_args:
    sheet_name: "TMT plex layout"

song_total_proteome_columns:
  type: pandas.ExcelDataset
  filepath: "data/datasets/song/primary/proteomics/song2024_tmttotal_protein_quant_merged_labeled (2).xlsx"
  load_args:
    header: 1
    nrows: 0

sample_mapping:
  type: pandas.CSVDataset
  filepath: outputs/reports/data_ingest/sample_mapping.csv
  save_args:
    index: false

# normalize pipeline — track-namespaced. The total proteome Excel is shared
# across tracks; each phospho sitequant Excel is per-track.
total_proteome_xlsx:
  type: pandas.ExcelDataset
  filepath: "data/datasets/song/primary/proteomics/song2024_tmttotal_protein_quant_merged_labeled (2).xlsx"
  load_args:
    header: 1
st.phospho_sitequant_xlsx:
  type: pandas.ExcelDataset
  filepath: "data/datasets/song/primary/phospho/song_IMAC_sitequant_merged_labeled (2).xlsx"
  load_args:
    header: 1
py.phospho_sitequant_xlsx:
  type: pandas.ExcelDataset
  filepath: "data/datasets/song/primary/phospho/song_pY_sitequant_merged_labeled (2).xlsx"
  load_args:
    header: 1

st.stoichiometry_qc:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/stoichiometry_qc.csv
  save_args: {index: false}
py.stoichiometry_qc:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/stoichiometry_qc_pY.csv
  save_args: {index: false}

st.normalization_summary:
  type: json.JSONDataset
  filepath: outputs/reports/kinase_attribution/normalization_summary.json
  save_args: {indent: 2}
py.normalization_summary:
  type: json.JSONDataset
  filepath: outputs/reports/kinase_attribution/normalization_summary_pY.json
  save_args: {indent: 2}

# enrich pipeline — track-namespaced via `pipeline(template, namespace="st"|"py")`.
# Catalog keys use Kedro's `<namespace>.<name>` form. The `stoichiometry_matrix`
# and `raw_phospho_normalized` entries are written by `normalize` and read by
# `enrich`; `save_args.index: false` matches the legacy script's CSV layout.
st.stoichiometry_matrix:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/stoichiometry_matrix.csv
  save_args: {index: false}
py.stoichiometry_matrix:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/stoichiometry_matrix_pY.csv
  save_args: {index: false}
st.raw_phospho_normalized:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/raw_phospho_normalized.csv
  save_args: {index: false}
py.raw_phospho_normalized:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/raw_phospho_normalized_pY.csv
  save_args: {index: false}

st.site_level_ols:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/site_level_ols.csv
  save_args: {index: false}
py.site_level_ols:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/site_level_ols_pY.csv
  save_args: {index: false}

st.mea_stoichiometry:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/mea_stoichiometry.csv
  save_args: {index: false}
py.mea_stoichiometry:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/mea_stoichiometry_pY.csv
  save_args: {index: false}

st.mea_global_shift:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/mea_global_shift.csv
  save_args: {index: false}
py.mea_global_shift:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/mea_global_shift_pY.csv
  save_args: {index: false}

st.winsorized_sites:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/winsorized_sites.csv
  save_args: {index: false}
py.winsorized_sites:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/winsorized_sites_pY.csv
  save_args: {index: false}

st.mea_substrate_sets:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/mea_substrate_sets.csv
  save_args: {index: false}
py.mea_substrate_sets:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/mea_substrate_sets_pY.csv
  save_args: {index: false}

# attribute pipeline (single namespace, consumes both st.* and py.* MEA outputs).
# Optional Song / WMB / SEA-AD inputs are guarded inside nodes via params; only
# the always-present static inputs and the pipeline outputs are catalog-managed.
kinase_to_gene_mapping:
  type: pandas.CSVDataset
  filepath: data/datasets/song/analysis_cache/kinase_to_gene_mapping.csv
seaad_to_wmb_class:
  type: pandas.CSVDataset
  filepath: data/external/sea_ad/seaad_subclass_to_wmb_class.csv

unified_attribution:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/unified_attribution.csv
  save_args: {index: false}
unified_attribution_full:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/unified_attribution_full.csv
  save_args: {index: false}
sea_ad_supertype_lfc:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/sea_ad_supertype_lfc.csv
  save_args: {index: false}
attribution_summary:
  type: json.JSONDataset
  filepath: outputs/reports/kinase_attribution/attribution_summary.json
  save_args: {indent: 2}

# mechanism pipeline (track-namespaced raw MEA + single-namespace combiner).
# `unified_attribution_with_mechanism` writes back to the same file as
# `unified_attribution`; distinct catalog keys avoid a self-loop.
st.mea_raw_phospho:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/mea_raw_phospho.csv
  save_args: {index: false}
py.mea_raw_phospho:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/mea_raw_phospho_pY.csv
  save_args: {index: false}
mechanism_annotation:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/mechanism_annotation.csv
  save_args: {index: false}
unified_attribution_with_mechanism:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/unified_attribution.csv
  save_args: {index: false}
