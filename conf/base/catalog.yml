# Datasets are declared as Phase 4 migrates each stage to Kedro nodes.
# Catalog grows incrementally; adding entries pre-emptively rots.

# ingest_mapping pipeline
song_tmt_layout:
  type: pandas.ExcelDataset
  filepath: "data/datasets/song/primary/metadata/Sample_list_72mice (1).xlsx"
  load_args:
    sheet_name: "TMT plex layout"

song_total_proteome_columns:
  type: pandas.ExcelDataset
  filepath: "data/datasets/song/primary/proteomics/song2024_tmttotal_protein_quant_merged_labeled (2).xlsx"
  load_args:
    header: 1
    nrows: 0

sample_mapping:
  type: pandas.CSVDataset
  filepath: outputs/reports/data_ingest/sample_mapping.csv
  save_args:
    index: false

# enrich pipeline — track-namespaced via `pipeline(template, namespace="st"|"py")`.
# Catalog keys use Kedro's `<namespace>.<name>` form.
st.stoichiometry_matrix:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/stoichiometry_matrix.csv
py.stoichiometry_matrix:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/stoichiometry_matrix_pY.csv
st.raw_phospho_normalized:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/raw_phospho_normalized.csv
py.raw_phospho_normalized:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/raw_phospho_normalized_pY.csv

st.site_level_ols:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/site_level_ols.csv
  save_args: {index: false}
py.site_level_ols:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/site_level_ols_pY.csv
  save_args: {index: false}

st.mea_stoichiometry:
  type: pandas.CSVDataset
  filepath: outputs/reports/kinase_attribution/mea_stoichiometry.csv
  save_args: {index: false}
py.mea_stoichiometry:
