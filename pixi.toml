[workspace]
authors = ["Henri Chung <henri.chung@cellsignal.com>"]
channels = ["conda-forge", "bioconda"]
name = "alzheimers"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
ingest = "python alz/ingest/song.py --run"
# Drive ingest is manifest-driven via the rclone-ingest engine (vendor/rclone-ingest
# submodule); sources live in conf/data_sources.yaml. `rclone-ingest check` preflights.
ingest-gdrive-shared = "rclone-ingest sync gdrive-shared"
ingest-lucie-proteomics = "rclone-ingest sync lucie-proteomics"
ingest-5xfad-reports = "rclone-ingest sync 5xfad-reports"
ingest-5xfad-raw-sne = "rclone-ingest sync 5xfad-raw-sne"
ingest-5xfad-snrna = "rclone-ingest sync 5xfad-snrna"
ingest-5xfad-snrna-rds = "rclone-ingest sync 5xfad-snrna --group scrna"
5xfad-ingest = "python -m alz.cohorts.fivexfad.ingest --ingest"
5xfad-build-omics-join-manifest = "python alz/ingest/build_5xfad_omics_join_manifest.py"
5xfad-mea = "python -m alz.cohorts.fivexfad.ingest --mea"
5xfad-snrna-attribution = "Rscript alz/ingest/build_5xfad_snrna_attribution.R"
5xfad-snrna-decomp-pseudobulk = "Rscript alz/ingest/build_5xfad_snrna_decomposition_pseudobulk.R"
5xfad-celltype-mea = { cmd = "python -m alz.cohorts.fivexfad.celltype_mea", depends-on = ["5xfad-snrna-decomp-pseudobulk"] }
5xfad-celltype-mea-smoke = { cmd = "python -m alz.cohorts.fivexfad.celltype_mea --tissue cortex --track py --max-celltypes 1", depends-on = ["5xfad-snrna-decomp-pseudobulk"] }
5xfad-viewer = { cmd = "python alz/build_unified_viewer.py", depends-on = ["5xfad-mea", "5xfad-snrna-attribution", "5xfad-celltype-mea"] }
5xfad-viewer-package = "python alz/build_unified_viewer.py --supporting-5xfad-only"
5xfad-inspect-snrna-rds = "Rscript alz/ingest/inspect_5xfad_snrna_rds.R"
5xfad-audit-snrna-transgenes = "Rscript alz/ingest/audit_5xfad_snrna_transgenes.R"
5xfad-audit-proteomics-sample-lists = "python alz/ingest/audit_5xfad_proteomics_sample_lists.py"
# 5xFAD Incytr pair-mode input pipeline (per-tissue, TG-vs-WT per age; t-cell pattern).
5xfad-export-bulk = "python -m alz.cohorts.fivexfad.ingest --export-bulk"
5xfad-incytr-scrna-extract = "Rscript alz/ingest/fivexfad_scrna_extract.R"
5xfad-incytr-decompose = "python alz/ingest/fivexfad_decompose.py"
5xfad-build-incytr-seurat = "Rscript alz/incytr_pair/build_5xfad_seurat.R"
5xfad-build-incytr-gene-list = "bash -c 'for t in cortex hippocampus; do pixi run Rscript alz/incytr_pair/build_5xfad_input_gene_list.R \"$t\"; done'"
5xfad-incytr = "bash alz/incytr_pair/run_pair_mode_5xfad.sh"
ingest-deconvolution-bulk = "rclone-ingest sync deconvolution-bulk"
ingest-tcells = "rclone-ingest sync tcells"
ingest-tcells-scrna = "rclone-ingest sync tcells --group scrna"
ingest-sce4-canonical = "rclone-ingest sync sce4-canonical"
ingest-sce4-source = "rclone-ingest sync sce4-source"
tcells-reshape = "python -m alz.cohorts.tcells.ingest --reshape"
tcells-perdonor = "python -m alz.cohorts.tcells.mea --donor both"
tcells-projectils-map = "bash alz/runners/supporting/tcells_projectils_map.sh"
tcells-scrna-extract = "bash alz/runners/supporting/tcells_scrna_extract.sh"
tcells-export-bulk = "python -m alz.cohorts.tcells.ingest --export-bulk"
tcells-decompose = "python alz/ingest/tcells_decompose.py"
tcells-build-incytr-seurat = "bash -c 'for d in donor1 donor2; do pixi run Rscript alz/incytr_pair/build_tcells_seurat.R \"$d\"; done'"
tcells-build-input-gene-list = "bash -c 'for d in donor1 donor2; do pixi run Rscript alz/incytr_pair/build_tcells_input_gene_list.R \"$d\"; done'"
tcells-build-kldata = "python alz/integration/build_tcells_kldata.py"
tcells-incytr = "bash alz/incytr_pair/run_pair_mode_tcells.sh"
install-projectils = "bash alz/runners/supporting/install_projectils.sh"
normalize = "python alz/bulk_mea/normalize.py"
enrich = "python alz/bulk_mea/enrich.py"
attribute = "python alz/bulk_mea/attribute.py"
mechanism = "python alz/bulk_mea/mechanism.py"
recover = "python alz/bulk_mea/recover.py"
live = { depends-on = ["ingest", "normalize", "enrich", "attribute", "mechanism", "recover"] }
dual = "bash alz/runners/main/run_dual_analysis.sh"
human-ingest = "python -m alz.cohorts.mukesh.ingest --reshape"
human-perdonor = "python -m alz.cohorts.mukesh.mea --track both"
human-seaad = "python alz/cross_reference/seaad_human_agreement.py"
concordance-overlap-ad8-excl01-03 = "python -m alz.ctrl_outlier_audit.concordance_overlap_AD_excl_01_03"
human = { depends-on = ["human-ingest", "human-perdonor", "human-seaad"] }
all = "bash alz/runners/main/run_all.sh"
atlas = "python alz/reference/atlas.py --run"
wmb-export = "python alz/reference/wmb_expression.py --run"
snrna = "python alz/reference/snrna_integration.py --run"
bubbles = "python alz/plot_attribution_bubbles.py"
viewer = "python alz/build_unified_viewer.py"
deploy-viewer = "bash alz/runners/supporting/deploy_viewer.sh unified"
deploy-tcell-viewer = "bash alz/runners/supporting/deploy_viewer.sh tcell"
deploy-all-viewers = "bash alz/runners/supporting/deploy_viewer.sh both"
tcell-within-cohort = "python alz/cross_reference/tcell_within_cohort.py donor1"
# TODO #2: 10x NSCLC cell-type specificity reference for the T-cell cohort.
nsclc-ingest = "bash alz/runners/supporting/ingest_nsclc_10x.sh"
nsclc-label = "python alz/reference/nsclc_expression.py --label-clusters"
nsclc-projectils = "bash alz/runners/supporting/run_nsclc_projectils.sh"
nsclc-expression = "python alz/reference/nsclc_expression.py --run"
nsclc-audit = "python alz/reference/nsclc_expression.py --audit"
tcell-viewer = { cmd = "python alz/build_tcell_viewer.py", depends-on = ["tcell-within-cohort"] }
install-incytr = "R CMD INSTALL --no-multiarch ../incytr"
verify-incytr-sce4 = "bash alz/incytr_pair/verify_incytr_sce4.sh"
verify-incytr-sce4-full = "Rscript alz/incytr_pair/verify_sce4_full.R"

[dependencies]
python = "3.11.*"
pip = "*"
# Kedro reintroduced 2026-05-27 for bioplat/Argo orchestration (no kedro-argo:
# abandoned; no kedro-docker: bioplat builds the image its own way). Version
# matches the canonical bioplat Kedro-service pin (0.19.x). kedro-datasets 3-4
# is the 0.19-era line; s3fs backs the S3 catalog (boto3 already present below).
kedro = "~=0.19.11"
kedro-datasets = ">=3,<5"
s3fs = "*"
# Pin reconciliation: kedro 0.19.x requires rich<14; and kinase-library (PyPI)
# pulls myst-parser>=4.0,<4.1 which needs markdown-it-py<4. Without these caps
# the conda solve grabs markdown-it-py 4.x and the PyPI side is unsatisfiable.
rich = ">=12,<14"
markdown-it-py = ">=3,<4"
# Versions pinned to match kinase-library 1.7.0 metadata (scipy/seaborn/sklearn/pandas have strict ~= bounds)
pandas = "~=2.2.3"
numpy = "~=1.26.4"
matplotlib = "~=3.8.3"
seaborn = "~=0.13.2"
scipy = "~=1.14.1"
scikit-learn = "~=1.6.0"
statsmodels = "~=0.14.2"
pyarrow = "~=18.0.0"
gseapy = "~=1.1.8"
requests = "*"
natsort = "~=8.3.1"
openpyxl = "*"
ipykernel = "*"
anndata = "*"
boto3 = "*"
r-base = ">=4.0.0"
r-devtools = "*"
r-remotes = "*"
r-matrix = "*"
r-forcats = "*"
"r-data.table" = "*"
r-matrixstats = "*"
r-knitr = "*"
r-rmarkdown = "*"
r-roxygen2 = "*"
r-seurat = ">=5.0.0"
# Read10X_h5 (NSCLC ProjecTILs subset projection) requires the HDF5 R binding.
r-hdf5r = "*"
r-testthat = ">=3.0.0"
bioconductor-limma = "*"
bioconductor-deseq2 = "*"
r-jsonlite = "*"
r-rcpp = "*"
r-ggplot2 = "*"
r-patchwork = "*"
r-dplyr = "*"
r-tidyr = "*"
r-purrr = "*"
r-stringr = "*"
r-magrittr = "*"
r-irkernel = "*"
r-duckdb = ">=1.5.2,<2"
r-dbi = ">=1.3.0,<2"
r-arrow = ">=18.0.0,<19"
duckdb = ">=1.5.2,<2"
r-readr = ">=2.2.0,<3"
# ProjecTILs reference-mapping stack for the T-cell exhaustion cohort (D4
# cluster annotation). UCell/scGate/STACAS/ProjecTILs are GitHub-only and
# installed via alz/runners/supporting/install_projectils.sh; their conda-
# available R deps are pulled in here so the GitHub install only compiles the
# four wrapper packages. glmGamPoi accelerates the SCT step in the reference
# atlases; BiocManager is the canonical bridge for the few Bioconductor deps
# (SingleCellExperiment / SummarizedExperiment) that ProjecTILs imports.
r-biocmanager = "*"
bioconductor-glmgampoi = "*"
bioconductor-singlecellexperiment = "*"
bioconductor-summarizedexperiment = "*"

[pypi-dependencies]
# Shared Drive-ingest engine (git submodule). Editable so the `rclone-ingest`
# console script is on PATH; sources are declared in conf/data_sources.yaml.
rclone-ingest = { path = "vendor/rclone-ingest", editable = true }
kinase-library = "*"
py-spy = ">=0.4.1, <0.5"
abc-atlas-access = { git = "https://github.com/alleninstitute/abc_atlas_access.git" }
