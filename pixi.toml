[workspace]
authors = ["Henri Chung <henri.chung@cellsignal.com>"]
channels = ["conda-forge", "bioconda"]
name = "alzheimers"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
ingest = "python alz/data_ingest.py --run"
ingest-gdrive-shared = "rclone copy gdrive_shared: data/external/gdrive_shared/ --drive-root-folder-id 1syiic6d9DUJIc1sPL5wc8uL7Od3Dsq3Z --progress"
ingest-lucie-proteomics = "rclone copy gdrive_shared: data/external/lucie_proteomics/ --drive-root-folder-id 1uWjRb_ZnrDp9HwgijE48zhb8gvJjOr2P --progress"
ingest-deconvolution-bulk = "rclone copy gdrive_shared:yuyu01/documentation/incytr/deconvolution/ data/datasets/song/proteomics/source/ --drive-root-folder-id 1syiic6d9DUJIc1sPL5wc8uL7Od3Dsq3Z --max-depth 1 --include imac_median.csv --include py_median.csv --include pr_median.csv --include yuyu_samplekey.csv --progress"
normalize = "python alz/kinase_normalize.py"
enrich = "python alz/kinase_enrich.py"
attribute = "python alz/kinase_attribute.py"
mechanism = "python alz/kinase_mechanism.py"
recover = "python alz/attribution_recovery.py"
live = { depends-on = ["ingest", "normalize", "enrich", "attribute", "recover"] }
dual = "bash alz/runners/main/run_dual_analysis.sh"
atlas = "python alz/atlas_reference.py --run"
wmb-export = "python alz/wmb_expression.py --run"
snrna = "python alz/snrna_integration.py --run"
bubbles = "python alz/plot_attribution_bubbles.py"
viewer = "python alz/build_unified_viewer.py"
install-incytr = "R CMD INSTALL --no-multiarch ../incytr"
export-factorial-inputs = "python alz/integration/export_factorial_inputs.py"
compute-seed-lists = "Rscript alz/integration/compute_seed_lists.R"
incytr-factorial = "bash alz/integration/run_factorial.sh"

[dependencies]
python = "3.11.*"
pip = "*"
# Versions pinned to match kinase-library 1.7.0 metadata (scipy/seaborn/sklearn/pandas have strict ~= bounds)
pandas = "~=2.2.3"
numpy = "~=1.26.4"
matplotlib = "~=3.8.3"
seaborn = "~=0.13.2"
scipy = "~=1.14.1"
scikit-learn = "~=1.6.0"
statsmodels = "~=0.14.2"
pyarrow = "~=18.0.0"
gseapy = "~=1.1.8"
requests = "*"
natsort = "~=8.3.1"
openpyxl = "*"
ipykernel = "*"
anndata = "*"
boto3 = "*"
r-base = ">=4.0.0"
r-devtools = "*"
r-remotes = "*"
r-matrix = "*"
r-forcats = "*"
"r-data.table" = "*"
r-matrixstats = "*"
r-knitr = "*"
r-rmarkdown = "*"
r-roxygen2 = "*"
r-seurat = ">=5.0.0"
r-testthat = ">=3.0.0"
bioconductor-limma = "*"
bioconductor-deseq2 = "*"
r-jsonlite = "*"
r-rcpp = "*"
r-ggplot2 = "*"
r-patchwork = "*"
r-dplyr = "*"
r-tidyr = "*"
r-purrr = "*"
r-stringr = "*"
r-magrittr = "*"
r-irkernel = "*"
r-duckdb = ">=1.5.2,<2"
r-dbi = ">=1.3.0,<2"
r-arrow = ">=18.0.0,<19"
duckdb = ">=1.5.2,<2"
r-readr = ">=2.2.0,<3"

[pypi-dependencies]
kinase-library = "*"
py-spy = ">=0.4.1, <0.5"
kedro = ">=1.3, <2"
kedro-datasets = { version = ">=9.3.0, <10", extras = ["pandas-csvdataset", "pandas-exceldataset"] }
